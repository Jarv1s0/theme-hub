name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/mihomo-party-org/theme-hub.git
          git fetch upstream

      - name: Sync main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -b sync-upstream || git checkout sync-upstream
          git reset --hard main
          git merge upstream/main --no-edit || {
            echo "⚠️ Merge conflict, creating PR instead..."
            exit 1
          }

          if ! git diff --quiet main; then
            git checkout main
            git merge sync-upstream --no-edit
            git push origin main
            echo "✅ Synced with upstream"
          else
            echo "⬆️ Already up to date"
          fi

      - name: Create PR on conflict
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'Auto sync from upstream'
          body: 'Merged from upstream. There may be conflicts — please review manually.'
          branch: 'sync-upstream'
          base: 'main'
          commit-message: 'sync: merge from upstream'
